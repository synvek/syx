      # - name: Registry prod URL smoke
      #   run: cargo test -p syx-pkg registry_prod_url_smoke -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.meta.outputs.tag }}
          path: dist/*

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package VS Code extension
        run: |
          npm install -g @vscode/vsce
          cd editors/vscode-syx
          vsce package --no-dependencies
          mkdir -p ../../dist
          mv *.vsix ../../dist/
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-syx-${{ needs.meta.outputs.tag }}
          path: dist/*.vsix
      - name: Create GitHub Release (release channel only)
        if: needs.meta.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          channel="${{ needs.meta.outputs.channel }}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          Prebuilt SYX CLI (channel **${channel}**, Cargo.toml **${version}**, tag **${tag}**).

          | OS | Arch | Artifact |
          |----|------|----------|
          | Linux | x86_64 | syx-linux-x86_64 |
          | Linux | aarch64 | syx-linux-aarch64 |
          | macOS | x86_64 | syx-macos-x86_64 |
          | macOS | aarch64 | syx-macos-aarch64 |
          | Windows | x86_64 | syx-windows-x86_64.exe |
          | Windows | aarch64 | syx-windows-aarch64.exe |

          Also includes VS Code extension .vsix when packaging succeeds.
          EOF

          # Each matrix job uploads its own SHA256SUMS with the same basename.
          # GitHub Release assets must have unique names; duplicates cause
          # uploads.github.com 404 "release not found" mid-upload.
          mkdir -p release-assets
          shopt -s nullglob
          for f in artifacts/*/*; do
            base="$(basename "$f")"
            if [ "$base" = "SHA256SUMS" ]; then
              continue
            fi
            if [ -e "release-assets/$base" ]; then
              echo "ERROR: duplicate release asset name: $base (from $f)" >&2
              exit 1
            fi
            cp "$f" "release-assets/$base"
          done
          if compgen -G 'dist/*.vsix' > /dev/null; then
            cp dist/*.vsix release-assets/
          fi
          (
            cd release-assets
            # Write outside the dir so the redirect does not include SHA256SUMS itself.
            sha256sum * > ../SHA256SUMS
            mv ../SHA256SUMS .
            cat SHA256SUMS
          )
          assets=(release-assets/*)
          ls -la "${assets[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" "${assets[@]}"
          fi
      - name: Dev channel summary (no git tag)
        if: needs.meta.outputs.create_tag != 'true'
        run: |
          echo "Dev channel: skipped git tag / GitHub Release."
          echo "Artifacts uploaded with suffix: ${{ needs.meta.outputs.tag }}"
          ls -la artifacts/*/* dist/*.vsix 2>/dev/null || true
