name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "release = unique tag + GitHub Release; dev = pre-release (reuse vX.Y.Z-dev, no unique tag)"
        required: true
        type: choice
        options:
          - release
          - dev
        default: release

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "21.1.6"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_label: ${{ steps.resolve.outputs.version_label }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and tag from Cargo.toml
        id: resolve
        run: |
          set -euo pipefail
          # Read [workspace.package].version (portable; no tomllib required).
          version="$(
            awk '
              /^\[workspace\.package\]/ { in_ws=1; next }
              /^\[/ { in_ws=0 }
              in_ws && /^version[[:space:]]*=/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )"
          if [ -z "${version}" ]; then
            echo "ERROR: could not parse workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          channel="${{ github.event.inputs.channel }}"
          if [ "$channel" = "dev" ]; then
            # Floating pre-release tag (overwritten each run); do not mint a unique tag.
            tag="v${version}-dev"
            create_tag="false"
            version_label="${version}-dev"
            prerelease="true"
          else
            # Tag and downloadable archive stem share the same run-number suffix
            # (tag = v${version_label}, archive = syx-sdk-${version_label}-*).
            tag="v${version}-${{ github.run_number }}"
            create_tag="true"
            version_label="${version}-${{ github.run_number }}"
            prerelease="false"
          fi
          {
            echo "version=${version}"
            echo "version_label=${version_label}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "create_tag=${create_tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "channel=${channel} version=${version} version_label=${version_label} tag=${tag} create_tag=${create_tag} prerelease=${prerelease}"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 / arm64
          # - os: ubuntu-24.04
          #   target: x86_64-unknown-linux-gnu
          #   artifact: syx-linux-x86_64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-x86_64-linux.tar.xz
          #   llvm_asset: LLVM-21.1.6-Linux-X64.tar.xz
          #   native_examples: true
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   artifact: syx-linux-aarch64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-aarch64-linux.tar.xz
          #   llvm_asset: LLVM-21.1.6-Linux-ARM64.tar.xz
          #   native_examples: true
          # macOS x64: llvmorg-21.1.6 has no official macOS x86_64 tarball (ARM64 only).
          # - os: macos-15-intel
          #   target: x86_64-apple-darwin
          #   artifact: syx-macos-x86_64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-x86_64-macos.tar.xz
          #   llvm_asset: ""
          #   native_examples: true
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: syx-macos-aarch64
            exe_ext: ""
            wasmtime_asset: wasmtime-v25.0.0-aarch64-macos.tar.xz
            llvm_asset: LLVM-21.1.6-macOS-ARM64.tar.xz
            native_examples: true
          # Windows x64 / arm64 (clang+llvm dev tarballs include llvm-config + libs)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: syx-windows-x86_64
            exe_ext: ".exe"
            wasmtime_asset: wasmtime-v25.0.0-x86_64-windows.zip
            llvm_asset: clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz
            native_examples: false
          # - os: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   artifact: syx-windows-aarch64
          #   exe_ext: ".exe"
          #   wasmtime_asset: wasmtime-v25.0.0-aarch64-windows.zip
          #   llvm_asset: clang+llvm-21.1.6-aarch64-pc-windows-msvc.tar.xz
          #   native_examples: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h || true
          case "${{ runner.os }}" in
            Linux)
              sudo rm -rf \
                /usr/share/dotnet \
                /usr/local/lib/android \
                /opt/ghc \
                /usr/local/share/boost \
                /usr/share/swift \
                /usr/local/.ghcup \
                /usr/lib/jvm \
                /opt/hostedtoolcache/CodeQL \
                /opt/hostedtoolcache/go \
                /opt/hostedtoolcache/Python \
                /opt/hostedtoolcache/Ruby \
                || true
              sudo apt-get clean || true
              docker system prune -af || true
              ;;
            macOS)
              for xcode_root in /Applications/Xcode.app /Applications/Xcode_*.app; do
                [ -d "${xcode_root}" ] || continue
                sudo rm -rf \
                  "${xcode_root}/Contents/Developer/Platforms/AppleTVOS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/AppleTVSimulator.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/WatchOS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/WatchSimulator.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/XROS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/XRSimulator.platform" \
                  || true
              done
              sudo rm -rf \
                /Users/runner/Library/Android \
                /Users/runner/hostedtoolcache/CodeQL \
                || true
              ;;
            Windows)
              rm -rf \
                "/c/Program Files/dotnet/sdk" \
                "/c/Program Files (x86)/Android" \
                "/c/ProgramData/chocolatey/lib" \
                "/c/hostedtoolcache/windows/CodeQL" \
                || true
              ;;
          esac
          df -h || true
      # syx-vm path dep: ../../../synui/crates/synui (sibling checkout required)
      - name: Checkout synui sibling for syx-vm
        run: git clone --depth 1 https://github.com/synvek/synui.git "${GITHUB_WORKSPACE}/../synui"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-full-native-${{ matrix.target }}-llvm${{ env.LLVM_VERSION }}
      - name: Install LLVM ${{ env.LLVM_VERSION }} (full-native)
        env:
          LLVM_ASSET: ${{ matrix.llvm_asset }}
        run: |
          set -euo pipefail
          if [ -z "${LLVM_ASSET}" ]; then
            echo "ERROR: matrix.llvm_asset is empty for this runner" >&2
            exit 1
          fi

          # Git Bash on Windows exposes RUNNER_TEMP / GITHUB_WORKSPACE as C:\...
          # which breaks tar/curl path handling ("Cannot connect to C:"). Normalize.
          to_unix() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -u "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          to_native() {
            # Path for Rust / llvm-sys (Windows needs drive-letter paths).
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -w "$1"
            elif (cd "$1" && pwd -W >/dev/null 2>&1); then
              (cd "$1" && pwd -W)
            else
              (cd "$1" && pwd)
            fi
          }

          WS_UNIX="$(to_unix "${GITHUB_WORKSPACE}")"
          # Prefer workspace-adjacent dirs so we never depend on RUNNER_TEMP shape.
          PREFIX_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm"
          STAGE_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm-extract"
          DL_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm-download"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ASSET}"

          rm -rf "${PREFIX_UNIX}" "${STAGE_UNIX}"
          mkdir -p "${STAGE_UNIX}" "${DL_UNIX}"

          echo "Downloading ${URL}"
          ARCHIVE_UNIX="${DL_UNIX}/${LLVM_ASSET}"
          # Download to disk first (reliable on Windows Git Bash), then extract.
          curl -fsSL --retry 5 --retry-delay 5 -o "${ARCHIVE_UNIX}" "${URL}"
          tar -xJf "${ARCHIVE_UNIX}" -C "${STAGE_UNIX}"
          rm -f "${ARCHIVE_UNIX}"

          # Official tarballs have a single top-level directory.
          TOP="$(find "${STAGE_UNIX}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${TOP}" ]; then
            echo "ERROR: no top-level directory in ${LLVM_ASSET}" >&2
            ls -la "${STAGE_UNIX}" >&2 || true
            exit 1
          fi
          mkdir -p "${PREFIX_UNIX}"
          shopt -s dotglob nullglob
          mv "${TOP}"/* "${PREFIX_UNIX}/"
          shopt -u dotglob nullglob
          rm -rf "${STAGE_UNIX}" "${DL_UNIX}"

          # Drop components not needed for inkwell/llvm-sys + syx-lld:
          # need: bin/llvm-config*, bin/lld*, include/{llvm,llvm-c,lld}, lib/LLVM*|liblld*|Polly*
          rm -rf \
            "${PREFIX_UNIX}/share" \
            "${PREFIX_UNIX}/libexec" \
            "${PREFIX_UNIX}/python" \
            "${PREFIX_UNIX}/lib/python"* \
            "${PREFIX_UNIX}/lib/clang" \
            "${PREFIX_UNIX}/lib/ocaml" \
            "${PREFIX_UNIX}/include/clang" \
            "${PREFIX_UNIX}/include/clang-c" \
            "${PREFIX_UNIX}/include/clang-tidy" \
            "${PREFIX_UNIX}/include/mlir" \
            "${PREFIX_UNIX}/include/mlir-c" \
            "${PREFIX_UNIX}/include/flang" \
            "${PREFIX_UNIX}/include/lldb" \
            "${PREFIX_UNIX}/include/openmp" \
            "${PREFIX_UNIX}/include/c++" \
            "${PREFIX_UNIX}/include/polly" \
            || true

          if [ -d "${PREFIX_UNIX}/bin" ]; then
            while IFS= read -r -d '' f; do
              base="$(basename "${f}")"
              case "${base}" in
                llvm-config|llvm-config.exe|lld|lld.exe|ld64.lld|ld.lld|lld-link|lld-link.exe|wasm-ld|wasm-ld.exe|*.dll)
                  ;;
                *)
                  rm -rf "${f}"
                  ;;
              esac
            done < <(find "${PREFIX_UNIX}/bin" -mindepth 1 -maxdepth 1 -print0)
          fi

          if [ -d "${PREFIX_UNIX}/lib" ]; then
            while IFS= read -r -d '' f; do
              base="$(basename "${f}")"
              case "${base}" in
                libLLVM*|LLVM*|liblld*|lld*|libPolly*|Polly*|cmake|libzstd*|zstd*|libxml2*|Remarks*)
                  ;;
                *)
                  rm -rf "${f}"
                  ;;
              esac
            done < <(find "${PREFIX_UNIX}/lib" -mindepth 1 -maxdepth 1 -print0)
          fi

          CFG="${PREFIX_UNIX}/bin/llvm-config"
          if [ ! -f "${CFG}" ]; then
            CFG="${PREFIX_UNIX}/bin/llvm-config.exe"
          fi
          if [ ! -f "${CFG}" ]; then
            echo "ERROR: llvm-config missing under ${PREFIX_UNIX}/bin" >&2
            ls -la "${PREFIX_UNIX}/bin" >&2 || true
            exit 1
          fi
          echo "Installed LLVM at ${PREFIX_UNIX}"
          "${CFG}" --version
          "${CFG}" --prefix
          du -sh "${PREFIX_UNIX}" "${PREFIX_UNIX}/bin" "${PREFIX_UNIX}/lib" "${PREFIX_UNIX}/include" || true
          df -h || true

          # llvm-sys reads LLVM_SYS_211_PREFIX (not SYX_LLVM_PREFIX). Export both
          # as native absolute paths so CI does not rely on .cargo relative env.
          NATIVE_PREFIX="$(to_native "${PREFIX_UNIX}")"
          {
            echo "SYX_LLVM_PREFIX=${NATIVE_PREFIX}"
            echo "LLVM_SYS_211_PREFIX=${NATIVE_PREFIX}"
          } >> "${GITHUB_ENV}"
          echo "SYX_LLVM_PREFIX=${NATIVE_PREFIX}"
          echo "LLVM_SYS_211_PREFIX=${NATIVE_PREFIX}"
      # Official Windows clang+llvm tarballs list libxml2s.lib in
      # `llvm-config --system-libs` but do not ship the file (llvm#172890).
      - name: Provide libxml2s.lib for Windows LLVM
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${LLVM_SYS_211_PREFIX:-}" ]; then
            echo "ERROR: LLVM_SYS_211_PREFIX unset; Install LLVM step must run first" >&2
            exit 1
          fi
          case "${TARGET}" in
            # Official Windows clang+llvm is /MT + rpmalloc; match with fully
            # static vcpkg libs (not *-static-md) so we do not mix ucrt (/MD).
            x86_64-*) TRIPLET=x64-windows-static ;;
            aarch64-*|arm64-*) TRIPLET=arm64-windows-static ;;
            *)
              echo "ERROR: unsupported Windows target for libxml2: ${TARGET}" >&2
              exit 1
              ;;
          esac
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "ERROR: VCPKG_INSTALLATION_ROOT unset on Windows runner" >&2
            exit 1
          fi
          VCPKG_UNIX="$(cygpath -u "${VCPKG_INSTALLATION_ROOT}")"
          LLVM_LIB_UNIX="$(cygpath -u "${LLVM_SYS_211_PREFIX}")/lib"
          mkdir -p "${LLVM_LIB_UNIX}"

          echo "Installing libxml2:${TRIPLET} via vcpkg"
          "${VCPKG_UNIX}/vcpkg.exe" install "libxml2:${TRIPLET}" --clean-after-build

          LIB_DIR="${VCPKG_UNIX}/installed/${TRIPLET}/lib"
          if [ ! -d "${LIB_DIR}" ]; then
            echo "ERROR: vcpkg lib dir missing: ${LIB_DIR}" >&2
            exit 1
          fi
          SRC=""
          for cand in "${LIB_DIR}/libxml2.lib" "${LIB_DIR}/libxml2s.lib" "${LIB_DIR}/xml2.lib"; do
            if [ -f "${cand}" ]; then
              SRC="${cand}"
              break
            fi
          done
          if [ -z "${SRC}" ]; then
            echo "ERROR: no libxml2 .lib under ${LIB_DIR}" >&2
            ls -la "${LIB_DIR}" >&2 || true
            exit 1
          fi
          # x64 llvm-config asks for libxml2s.lib; arm64 packages have been
          # seen asking for xml2s.lib. Provide both names for llvm-sys/MSVC.
          cp "${SRC}" "${LLVM_LIB_UNIX}/libxml2s.lib"
          cp "${SRC}" "${LLVM_LIB_UNIX}/xml2s.lib"
          echo "Installed libxml2s.lib and xml2s.lib from ${SRC}"
          CFG_SYS="${LLVM_LIB_UNIX%/lib}/bin/llvm-config"
          if [ ! -f "${CFG_SYS}" ]; then
            CFG_SYS="${CFG_SYS}.exe"
          fi
          if [ -f "${CFG_SYS}" ]; then
            echo "llvm-config --system-libs:"
            "${CFG_SYS}" --system-libs --link-static || "${CFG_SYS}" --system-libs || true
          fi

          # Static libxml2 pulls zlib/iconv/lzma; llvm-sys / syx-lld only forward
          # llvm-config --system-libs (libxml2s.lib / xml2s.lib, not deps).
          # Copy those into LLVM lib/ so the existing -L path finds them.
          # Newer vcpkg x64-windows-static names zlib `zs.lib`.
          if [ -f "${LIB_DIR}/zs.lib" ] && [ ! -f "${LIB_DIR}/zlib.lib" ]; then
            cp "${LIB_DIR}/zs.lib" "${LIB_DIR}/zlib.lib"
            echo "Normalized zs.lib → zlib.lib"
          fi
          for dep in zlib zs libiconv lzma liblzma charset iconv; do
            if [ -f "${LIB_DIR}/${dep}.lib" ]; then
              cp "${LIB_DIR}/${dep}.lib" "${LLVM_LIB_UNIX}/${dep}.lib"
              echo "Installed ${dep}.lib into LLVM lib/"
            fi
          done
          ls -la "${LLVM_LIB_UNIX}/libxml2s.lib" "${LLVM_LIB_UNIX}/xml2s.lib"
      - name: Build release CLI (full-native)
        run: |
          set -euo pipefail
          echo "SYX_LLVM_PREFIX=${SYX_LLVM_PREFIX:-}"
          echo "LLVM_SYS_211_PREFIX=${LLVM_SYS_211_PREFIX:-}"
          unset RUSTFLAGS || true
          CFG="${LLVM_SYS_211_PREFIX}/bin/llvm-config"
          if [ ! -f "${CFG}" ] && [ ! -f "${CFG}.exe" ]; then
            # Git Bash may need Unix path to test existence when env is Windows-native.
            if command -v cygpath >/dev/null 2>&1; then
              CFG_UNIX="$(cygpath -u "${LLVM_SYS_211_PREFIX}")/bin/llvm-config"
              CFG="${CFG_UNIX}"
            fi
          fi
          if [ -f "${CFG}" ]; then
            "${CFG}" --version
          elif [ -f "${CFG}.exe" ]; then
            "${CFG}.exe" --version
          else
            echo "ERROR: llvm-config not reachable via LLVM_SYS_211_PREFIX=${LLVM_SYS_211_PREFIX:-}" >&2
            exit 1
          fi
          TARGET="${{ matrix.target }}"
          # Windows: +crt-static only for this CLI build (isolated target-dir). Do not
          # put it in .cargo/config.toml — that contaminates syx_rt for native link.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --release -p syx-cli --features full-native --target "${TARGET}" \
              --target-dir target-full-native \
              --config "target.${TARGET}.rustflags=[\"-C\",\"target-feature=+crt-static\",\"-C\",\"link-arg=/INCLUDE:malloc\"]"
            mkdir -p "target/${TARGET}/release"
            cp "target-full-native/${TARGET}/release/syx${{ matrix.exe_ext }}" \
              "target/${TARGET}/release/syx${{ matrix.exe_ext }}"
          else
            cargo build --release -p syx-cli --features full-native --target "${TARGET}"
          fi

      # - name: Driver parity smoke (SYX 38.0)
      #   run: |
      #     cargo test -p syx-driver \
      #       --test evergreen --test lang --test concurrency --test stdlib \
      #       --test observability --test security --test backends \
      #       -- --test-threads=1
      # - name: examples/deps cross-module (local_math.add → 42)
      #   run: |
      #     BIN="target/${{ matrix.target }}/release/syx${{ matrix.exe_ext }}"
      #     "$BIN" run examples/deps | grep -q 42
      # - name: Build examples/hello native (minimal)
      #   if: matrix.native_examples
      #   run: |
      #     BIN="target/${{ matrix.target }}/release/syx${{ matrix.exe_ext }}"
      #     mkdir -p dist
      #     "$BIN" build --native --minimal -o "dist/examples-main-${{ matrix.artifact }}" examples
      - name: Package syx-sdk (CLI + libsyx_rt profiles)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          EXE_EXT="${{ matrix.exe_ext }}"
          ARTIFACT="${{ matrix.artifact }}"
          VERSION_LABEL="${{ needs.meta.outputs.version_label }}"
          BIN="target/${TARGET}/release/syx${EXE_EXT}"
          if [ ! -f "${BIN}" ]; then
            echo "ERROR: missing CLI binary ${BIN}" >&2
            exit 1
          fi
          if [ -z "${VERSION_LABEL}" ]; then
            echo "ERROR: empty version_label from meta job" >&2
            exit 1
          fi

          # Archive root directory is `syx/` (not `syx-sdk/`).
          SDK_ROOT="sdk-stage/syx"
          rm -rf sdk-stage
          mkdir -p "${SDK_ROOT}/bin" "${SDK_ROOT}/lib/profiles"

          cp "${BIN}" "${SDK_ROOT}/bin/syx${EXE_EXT}"
          chmod +x "${SDK_ROOT}/bin/syx${EXE_EXT}" || true
          # Do not ship a separate lld/lld-link binary: full-native embeds LLD
          # in-process into syx (single-file CLI; avoids extra LLVM redistrib).
          cp packaging/syx-sdk/README.md "${SDK_ROOT}/README.md"
          cp LICENSE "${SDK_ROOT}/LICENSE"

          # Reference trees for end users (stdlib sources + samples).
          copy_ref_tree() {
            local src="$1"
            local dest="$2"
            if [ ! -d "${src}" ]; then
              echo "ERROR: missing reference tree ${src}" >&2
              exit 1
            fi
            mkdir -p "${dest}"
            if command -v rsync >/dev/null 2>&1; then
              rsync -a \
                --exclude '.DS_Store' \
                --exclude '.syx-cache' \
                --exclude 'target' \
                --exclude '*.rlib' \
                "${src}/" "${dest}/"
            else
              # Git Bash / minimal runners: recursive copy then drop junk.
              cp -R "${src}/." "${dest}/"
              find "${dest}" \( -name '.DS_Store' -o -name '.syx-cache' -o -name 'target' \) -prune -exec rm -rf {} + 2>/dev/null || true
            fi
          }
          copy_ref_tree packages "${SDK_ROOT}/packages"
          copy_ref_tree examples "${SDK_ROOT}/examples"
          # Repo path is `tutorial/` (singular); ship under the same name.
          copy_ref_tree tutorial "${SDK_ROOT}/tutorial"

          # Locate cargo staticlib output for a given --target-dir root.
          find_rt_lib() {
            local root="$1"
            local cand
            for cand in \
              "${root}/${TARGET}/release/libsyx_rt.a" \
              "${root}/${TARGET}/release/syx_rt.lib" \
              "${root}/release/libsyx_rt.a" \
              "${root}/release/syx_rt.lib"
            do
              if [ -f "${cand}" ]; then
                printf '%s\n' "${cand}"
                return 0
              fi
            done
            # Hashed deps names (prefer non-.rlib).
            cand="$(find "${root}" \( -name 'libsyx_rt*.a' -o -name 'syx_rt.lib' -o -name 'syx_rt-*.lib' \) ! -name '*.rlib' 2>/dev/null | head -n 1 || true)"
            if [ -n "${cand}" ] && [ -f "${cand}" ]; then
              printf '%s\n' "${cand}"
              return 0
            fi
            return 1
          }

          install_rt_profile() {
            local id="$1"
            shift
            local tdir="target/sdk-rt-${id}"
            echo "Building syx-rt profile '${id}' → ${tdir}"
            # Build syx_rt without CLI-only Windows CRT flags (those live only in
            # the full-native CLI `--config` / target-full-native invocation).
            RUSTFLAGS="${SYX_RT_RUSTFLAGS:-}" \
              cargo build --release -p syx-rt --target "${TARGET}" --target-dir "${tdir}" "$@"
            local src
            src="$(find_rt_lib "${tdir}")" || {
              echo "ERROR: libsyx_rt archive not found under ${tdir}" >&2
              find "${tdir}" -name '*syx_rt*' 2>/dev/null | head -n 50 >&2 || true
              exit 1
            }
            local dest_dir="${SDK_ROOT}/lib/profiles/${id}"
            mkdir -p "${dest_dir}"
            local base
            base="$(basename "${src}")"
            # Normalize Windows hashed names to syx_rt.lib
            case "${base}" in
              syx_rt-*.lib) base="syx_rt.lib" ;;
              libsyx_rt-*.a) base="libsyx_rt.a" ;;
            esac
            cp "${src}" "${dest_dir}/${base}"
            echo "  installed ${dest_dir}/${base} (from ${src})"
            # Default flat lib = full profile
            if [ "${id}" = "full" ]; then
              cp "${dest_dir}/${base}" "${SDK_ROOT}/lib/${base}"
            fi
          }

          # Feature map matches packaging/syx-sdk/README.md
          install_rt_profile full --features full
          install_rt_profile minimal --no-default-features
          install_rt_profile async-only --no-default-features --features async-runtime
          install_rt_profile async-http --no-default-features --features async-runtime,http
          install_rt_profile async-file --no-default-features --features async-runtime,file

          # NOTE: lib/sysroot is intentionally not packaged for now (MSVC/WinSDK
          # import .lib redistrib concerns). Native link falls back to host VS/Xcode/CLT.
          # collect-sysroot.{sh,ps1} kept for a future self-built import-lib approach.

          mkdir -p dist
          # matrix.artifact is syx-<platform-arch>;
          # archive is syx-sdk-<version_label>-<platform-arch>.{zip|tar.gz}
          PLATFORM="${ARTIFACT#syx-}"
          case "${{ runner.os }}" in
            Windows)
              ARCHIVE="dist/syx-sdk-${VERSION_LABEL}-${PLATFORM}.zip"
              rm -f "${ARCHIVE}"
              ARCHIVE_WIN="$(cygpath -w "${ARCHIVE}")"
              SDK_WIN="$(cygpath -w sdk-stage/syx)"
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path '${SDK_WIN}' -DestinationPath '${ARCHIVE_WIN}' -Force"
              ;;
            *)
              ARCHIVE="dist/syx-sdk-${VERSION_LABEL}-${PLATFORM}.tar.gz"
              rm -f "${ARCHIVE}"
              tar -czf "${ARCHIVE}" -C sdk-stage syx
              ;;
          esac

          echo "Packaged ${ARCHIVE}"
          find sdk-stage/syx -type f | sort
          ls -la dist/

          # Native SDK layout smoke (static rt; single-file contract — no sysroot yet).
          SDK_BIN="sdk-stage/syx/bin/syx${{ matrix.exe_ext }}"
          if [ -x "${SDK_BIN}" ] || [ -f "${SDK_BIN}" ]; then
            "${SDK_BIN}" doctor --native-sdk
            test ! -d "sdk-stage/syx/lib/sysroot"
          fi
      - name: Generate checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS
