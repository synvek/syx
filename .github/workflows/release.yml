  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package VS Code extension
        run: |
          npm install -g @vscode/vsce
          cd editors/vscode-syx
          vsce package --no-dependencies
          mkdir -p ../../dist
          mv *.vsix ../../dist/
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-syx-${{ needs.meta.outputs.tag }}
          path: dist/*.vsix
      - name: Create GitHub Release (release channel only)
        if: needs.meta.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          channel="${{ needs.meta.outputs.channel }}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          Prebuilt SYX CLI (channel **${channel}**, Cargo.toml **${version}**, tag **${tag}**).

          | OS | Arch | Artifact |
          |----|------|----------|
          | Linux | x86_64 | syx-linux-x86_64 |
          | Linux | aarch64 | syx-linux-aarch64 |
          | macOS | x86_64 | syx-macos-x86_64 |
          | macOS | aarch64 | syx-macos-aarch64 |
          | Windows | x86_64 | syx-windows-x86_64.exe |
          | Windows | aarch64 | syx-windows-aarch64.exe |

          Also includes VS Code extension .vsix when packaging succeeds.
          EOF
          assets=(artifacts/*/*)
          if compgen -G 'dist/*.vsix' > /dev/null; then
            assets+=(dist/*.vsix)
          fi
          gh release create "$tag" --title "$tag" --notes-file "$notes_file" "${assets[@]}" \
            || gh release upload "$tag" "${assets[@]}"
      - name: Dev channel summary (no git tag)
        if: needs.meta.outputs.create_tag != 'true'
        run: |
          echo "Dev channel: skipped git tag / GitHub Release."
          echo "Artifacts uploaded with suffix: ${{ needs.meta.outputs.tag }}"
          ls -la artifacts/*/* dist/*.vsix 2>/dev/null || true
