name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (dev = artifacts only with -dev; release = unique git tag + GitHub Release)"
        required: true
        type: choice
        options:
          - release
          - dev
        default: release

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and tag from Cargo.toml
        id: resolve
        run: |
          set -euo pipefail
          # Read [workspace.package].version (portable; no tomllib required).
          version="$(
            awk '
              /^\[workspace\.package\]/ { in_ws=1; next }
              /^\[/ { in_ws=0 }
              in_ws && /^version[[:space:]]*=/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )"
          if [ -z "${version}" ]; then
            echo "ERROR: could not parse workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          channel="${{ github.event.inputs.channel }}"
          if [ "$channel" = "dev" ]; then
            tag="v${version}-dev"
            create_tag="false"
          else
            tag="v${version}-${{ github.run_number }}"
            create_tag="true"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "create_tag=${create_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "channel=${channel} version=${version} tag=${tag} create_tag=${create_tag}"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
