  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package VS Code extension
        run: |
          # Must install extension deps and package WITH dependencies.
          # `--no-dependencies` yields ~20KB shells missing vscode-languageclient
          # (LSP/DAP broken). Local `npm run package` is ~400KB for comparison.
          cd editors/vscode-syx
          npm ci
          npx vsce package
          mkdir -p ../../dist
          mv *.vsix ../../dist/
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-syx-${{ needs.meta.outputs.tag }}
          path: dist/*.vsix
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          version_label="${{ needs.meta.outputs.version_label }}"
          channel="${{ needs.meta.outputs.channel }}"
          prerelease="${{ needs.meta.outputs.prerelease }}"
          create_tag="${{ needs.meta.outputs.create_tag }}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          Prebuilt **SYX SDK** (channel **${channel}**, Cargo.toml **${version}**, release **${tag}**, run **${{ github.run_number }}**).

          Each archive unpacks to a \`syx/\` tree: \`bin/syx\`, \`lib/libsyx_rt*\` (native link), runtime profiles under \`lib/profiles/\`, reference \`packages/\` + \`examples/\` + \`tutorial/\`, plus \`README.md\` and \`LICENSE\`. Native link currently requires system SDK (Windows SDK, XCode SDK) for linking; 

          | OS | Arch | Artifact |
          |----|------|----------|
          | Linux | x86_64 | syx-sdk-${version_label}-linux-x86_64.tar.gz |
          | Linux | aarch64 | syx-sdk-${version_label}-linux-aarch64.tar.gz |
          | macOS | x86_64 | syx-sdk-${version_label}-macos-x86_64.tar.gz |
          | macOS | aarch64 | syx-sdk-${version_label}-macos-aarch64.tar.gz |
          | Windows | x86_64 | syx-sdk-${version_label}-windows-x86_64.zip |
          | Windows | aarch64 | syx-sdk-${version_label}-windows-aarch64.zip |

          Also includes VS Code extension .vsix when packaging succeeds.
          EOF

          # Each matrix job uploads its own SHA256SUMS with the same basename.
          # GitHub Release assets must have unique names; duplicates cause
          # uploads.github.com 404 "release not found" mid-upload.
          mkdir -p release-assets
          shopt -s nullglob
          for f in artifacts/*/*; do
            base="$(basename "$f")"
            if [ "$base" = "SHA256SUMS" ]; then
              continue
            fi
            if [ -e "release-assets/$base" ]; then
              echo "ERROR: duplicate release asset name: $base (from $f)" >&2
              exit 1
            fi
            cp "$f" "release-assets/$base"
          done
          if compgen -G 'dist/*.vsix' > /dev/null; then
            cp dist/*.vsix release-assets/
          fi
          (
            cd release-assets
            # Write outside the dir so the redirect does not include SHA256SUMS itself.
            sha256sum * > ../SHA256SUMS
            mv ../SHA256SUMS .
            cat SHA256SUMS
          )
          assets=(release-assets/*)
          ls -la "${assets[@]}"

          title="${tag}"
          if [ "$channel" = "dev" ]; then
            title="${tag} (run ${{ github.run_number }})"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # Dev floating tag (and rare re-runs): refresh notes/target and replace assets.
            edit_flags=(--title "$title" --notes-file "$notes_file" --target "${{ github.sha }}")
            if [ "$prerelease" = "true" ]; then
              edit_flags+=(--prerelease)
            else
              edit_flags+=(--latest)
            fi
            gh release edit "$tag" "${edit_flags[@]}"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            create_flags=(--title "$title" --notes-file "$notes_file" --target "${{ github.sha }}")
            if [ "$prerelease" = "true" ]; then
              create_flags+=(--prerelease)
            fi
            # release: unique tag vX.Y.Z-<run>.
            # dev: floating vX.Y.Z-dev only (pre-release; no per-run unique tag).
            echo "Publishing GitHub Release tag=${tag} create_tag=${create_tag} prerelease=${prerelease}"
            gh release create "$tag" "${create_flags[@]}" "${assets[@]}"
          fi

          echo "Published: https://github.com/${{ github.repository }}/releases/tag/${tag}"
