name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (dev = artifacts only with -dev; release = unique git tag + GitHub Release)"
        required: true
        type: choice
        options:
          - release
          - dev
        default: release

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "21.1.6"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and tag from Cargo.toml
        id: resolve
        run: |
          set -euo pipefail
          # Read [workspace.package].version (portable; no tomllib required).
          version="$(
            awk '
              /^\[workspace\.package\]/ { in_ws=1; next }
              /^\[/ { in_ws=0 }
              in_ws && /^version[[:space:]]*=/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )"
          if [ -z "${version}" ]; then
            echo "ERROR: could not parse workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          channel="${{ github.event.inputs.channel }}"
          if [ "$channel" = "dev" ]; then
            tag="v${version}-dev"
            create_tag="false"
          else
            tag="v${version}-${{ github.run_number }}"
            create_tag="true"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "create_tag=${create_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "channel=${channel} version=${version} tag=${tag} create_tag=${create_tag}"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 / arm64
          # - os: ubuntu-24.04
          #   target: x86_64-unknown-linux-gnu
          #   artifact: syx-linux-x86_64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-x86_64-linux.tar.xz
          #   llvm_asset: LLVM-21.1.6-Linux-X64.tar.xz
          #   native_examples: true
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   artifact: syx-linux-aarch64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-aarch64-linux.tar.xz
          #   llvm_asset: LLVM-21.1.6-Linux-ARM64.tar.xz
          #   native_examples: true
          # macOS x64: llvmorg-21.1.6 has no official macOS x86_64 tarball (ARM64 only).
          # - os: macos-15-intel
          #   target: x86_64-apple-darwin
          #   artifact: syx-macos-x86_64
          #   exe_ext: ""
          #   wasmtime_asset: wasmtime-v25.0.0-x86_64-macos.tar.xz
          #   llvm_asset: ""
          #   native_examples: true
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: syx-macos-aarch64
            exe_ext: ""
            wasmtime_asset: wasmtime-v25.0.0-aarch64-macos.tar.xz
            llvm_asset: LLVM-21.1.6-macOS-ARM64.tar.xz
            native_examples: true
          # Windows x64 / arm64 (clang+llvm dev tarballs include llvm-config + libs)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: syx-windows-x86_64
            exe_ext: ".exe"
            wasmtime_asset: wasmtime-v25.0.0-x86_64-windows.zip
            llvm_asset: clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz
            native_examples: false
          # - os: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   artifact: syx-windows-aarch64
          #   exe_ext: ".exe"
          #   wasmtime_asset: wasmtime-v25.0.0-aarch64-windows.zip
          #   llvm_asset: clang+llvm-21.1.6-aarch64-pc-windows-msvc.tar.xz
          #   native_examples: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h || true
          case "${{ runner.os }}" in
            Linux)
              sudo rm -rf \
                /usr/share/dotnet \
                /usr/local/lib/android \
                /opt/ghc \
                /usr/local/share/boost \
                /usr/share/swift \
                /usr/local/.ghcup \
                /usr/lib/jvm \
                /opt/hostedtoolcache/CodeQL \
                /opt/hostedtoolcache/go \
                /opt/hostedtoolcache/Python \
                /opt/hostedtoolcache/Ruby \
                || true
              sudo apt-get clean || true
              docker system prune -af || true
              ;;
            macOS)
              for xcode_root in /Applications/Xcode.app /Applications/Xcode_*.app; do
                [ -d "${xcode_root}" ] || continue
                sudo rm -rf \
                  "${xcode_root}/Contents/Developer/Platforms/AppleTVOS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/AppleTVSimulator.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/WatchOS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/WatchSimulator.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/XROS.platform" \
                  "${xcode_root}/Contents/Developer/Platforms/XRSimulator.platform" \
                  || true
              done
              sudo rm -rf \
                /Users/runner/Library/Android \
                /Users/runner/hostedtoolcache/CodeQL \
                || true
              ;;
            Windows)
              rm -rf \
                "/c/Program Files/dotnet/sdk" \
                "/c/Program Files (x86)/Android" \
                "/c/ProgramData/chocolatey/lib" \
                "/c/hostedtoolcache/windows/CodeQL" \
                || true
              ;;
          esac
          df -h || true
      # syx-vm path dep: ../../../synui/crates/synui (sibling checkout required)
      - name: Checkout synui sibling for syx-vm
        run: git clone --depth 1 https://github.com/synvek/synui.git "${GITHUB_WORKSPACE}/../synui"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-full-native-${{ matrix.target }}-llvm${{ env.LLVM_VERSION }}
      - name: Install LLVM ${{ env.LLVM_VERSION }} (full-native)
        env:
          LLVM_ASSET: ${{ matrix.llvm_asset }}
        run: |
          set -euo pipefail
          if [ -z "${LLVM_ASSET}" ]; then
            echo "ERROR: matrix.llvm_asset is empty for this runner" >&2
            exit 1
          fi

          # Git Bash on Windows exposes RUNNER_TEMP / GITHUB_WORKSPACE as C:\...
          # which breaks tar/curl path handling ("Cannot connect to C:"). Normalize.
          to_unix() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -u "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          to_native() {
            # Path for Rust / llvm-sys (Windows needs drive-letter paths).
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -w "$1"
            elif (cd "$1" && pwd -W >/dev/null 2>&1); then
              (cd "$1" && pwd -W)
            else
              (cd "$1" && pwd)
            fi
          }

          WS_UNIX="$(to_unix "${GITHUB_WORKSPACE}")"
          # Prefer workspace-adjacent dirs so we never depend on RUNNER_TEMP shape.
          PREFIX_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm"
          STAGE_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm-extract"
          DL_UNIX="$(cd "${WS_UNIX}/.." && pwd)/llvm-download"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ASSET}"

          rm -rf "${PREFIX_UNIX}" "${STAGE_UNIX}"
          mkdir -p "${STAGE_UNIX}" "${DL_UNIX}"

          echo "Downloading ${URL}"
          ARCHIVE_UNIX="${DL_UNIX}/${LLVM_ASSET}"
          # Download to disk first (reliable on Windows Git Bash), then extract.
          curl -fsSL --retry 5 --retry-delay 5 -o "${ARCHIVE_UNIX}" "${URL}"
          tar -xJf "${ARCHIVE_UNIX}" -C "${STAGE_UNIX}"
          rm -f "${ARCHIVE_UNIX}"

          # Official tarballs have a single top-level directory.
          TOP="$(find "${STAGE_UNIX}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${TOP}" ]; then
            echo "ERROR: no top-level directory in ${LLVM_ASSET}" >&2
            ls -la "${STAGE_UNIX}" >&2 || true
            exit 1
          fi
          mkdir -p "${PREFIX_UNIX}"
          shopt -s dotglob nullglob
          mv "${TOP}"/* "${PREFIX_UNIX}/"
          shopt -u dotglob nullglob
          rm -rf "${STAGE_UNIX}" "${DL_UNIX}"

          # Drop components not needed for inkwell/llvm-sys + syx-lld:
          # need: bin/llvm-config*, bin/lld*, include/{llvm,llvm-c,lld}, lib/LLVM*|liblld*|Polly*
          rm -rf \
            "${PREFIX_UNIX}/share" \
            "${PREFIX_UNIX}/libexec" \
            "${PREFIX_UNIX}/python" \
            "${PREFIX_UNIX}/lib/python"* \
            "${PREFIX_UNIX}/lib/clang" \
            "${PREFIX_UNIX}/lib/ocaml" \
            "${PREFIX_UNIX}/include/clang" \
            "${PREFIX_UNIX}/include/clang-c" \
            "${PREFIX_UNIX}/include/clang-tidy" \
            "${PREFIX_UNIX}/include/mlir" \
            "${PREFIX_UNIX}/include/mlir-c" \
            "${PREFIX_UNIX}/include/flang" \
            "${PREFIX_UNIX}/include/lldb" \
            "${PREFIX_UNIX}/include/openmp" \
            "${PREFIX_UNIX}/include/c++" \
            "${PREFIX_UNIX}/include/polly" \
            || true

          if [ -d "${PREFIX_UNIX}/bin" ]; then
            while IFS= read -r -d '' f; do
              base="$(basename "${f}")"
              case "${base}" in
                llvm-config|llvm-config.exe|lld|lld.exe|ld64.lld|ld.lld|lld-link|lld-link.exe|wasm-ld|wasm-ld.exe|*.dll)
                  ;;
                *)
                  rm -rf "${f}"
                  ;;
              esac
            done < <(find "${PREFIX_UNIX}/bin" -mindepth 1 -maxdepth 1 -print0)
          fi

          if [ -d "${PREFIX_UNIX}/lib" ]; then
            while IFS= read -r -d '' f; do
              base="$(basename "${f}")"
              case "${base}" in
                libLLVM*|LLVM*|liblld*|lld*|libPolly*|Polly*|cmake|libzstd*|zstd*|libxml2*|Remarks*)
                  ;;
                *)
                  rm -rf "${f}"
                  ;;
              esac
            done < <(find "${PREFIX_UNIX}/lib" -mindepth 1 -maxdepth 1 -print0)
          fi

          CFG="${PREFIX_UNIX}/bin/llvm-config"
          if [ ! -f "${CFG}" ]; then
            CFG="${PREFIX_UNIX}/bin/llvm-config.exe"
          fi
          if [ ! -f "${CFG}" ]; then
            echo "ERROR: llvm-config missing under ${PREFIX_UNIX}/bin" >&2
            ls -la "${PREFIX_UNIX}/bin" >&2 || true
            exit 1
          fi
          echo "Installed LLVM at ${PREFIX_UNIX}"
          "${CFG}" --version
          "${CFG}" --prefix
          du -sh "${PREFIX_UNIX}" "${PREFIX_UNIX}/bin" "${PREFIX_UNIX}/lib" "${PREFIX_UNIX}/include" || true
          df -h || true

          # llvm-sys reads LLVM_SYS_211_PREFIX (not SYX_LLVM_PREFIX). Export both
          # as native absolute paths so CI does not rely on .cargo relative env.
          NATIVE_PREFIX="$(to_native "${PREFIX_UNIX}")"
          {
            echo "SYX_LLVM_PREFIX=${NATIVE_PREFIX}"
            echo "LLVM_SYS_211_PREFIX=${NATIVE_PREFIX}"
          } >> "${GITHUB_ENV}"
          echo "SYX_LLVM_PREFIX=${NATIVE_PREFIX}"
          echo "LLVM_SYS_211_PREFIX=${NATIVE_PREFIX}"
      # Official Windows clang+llvm tarballs list libxml2s.lib in
      # `llvm-config --system-libs` but do not ship the file (llvm#172890).
      - name: Provide libxml2s.lib for Windows LLVM
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${LLVM_SYS_211_PREFIX:-}" ]; then
            echo "ERROR: LLVM_SYS_211_PREFIX unset; Install LLVM step must run first" >&2
            exit 1
          fi
          case "${TARGET}" in
            # Official Windows clang+llvm is /MT + rpmalloc; match with fully
            # static vcpkg libs (not *-static-md) so we do not mix ucrt (/MD).
            x86_64-*) TRIPLET=x64-windows-static ;;
            aarch64-*|arm64-*) TRIPLET=arm64-windows-static ;;
            *)
              echo "ERROR: unsupported Windows target for libxml2: ${TARGET}" >&2
              exit 1
              ;;
          esac
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "ERROR: VCPKG_INSTALLATION_ROOT unset on Windows runner" >&2
            exit 1
          fi
          VCPKG_UNIX="$(cygpath -u "${VCPKG_INSTALLATION_ROOT}")"
          LLVM_LIB_UNIX="$(cygpath -u "${LLVM_SYS_211_PREFIX}")/lib"
          mkdir -p "${LLVM_LIB_UNIX}"

          echo "Installing libxml2:${TRIPLET} via vcpkg"
          "${VCPKG_UNIX}/vcpkg.exe" install "libxml2:${TRIPLET}" --clean-after-build

          LIB_DIR="${VCPKG_UNIX}/installed/${TRIPLET}/lib"
          if [ ! -d "${LIB_DIR}" ]; then
            echo "ERROR: vcpkg lib dir missing: ${LIB_DIR}" >&2
            exit 1
          fi
          SRC=""
          for cand in "${LIB_DIR}/libxml2.lib" "${LIB_DIR}/libxml2s.lib" "${LIB_DIR}/xml2.lib"; do
            if [ -f "${cand}" ]; then
              SRC="${cand}"
              break
            fi
          done
          if [ -z "${SRC}" ]; then
            echo "ERROR: no libxml2 .lib under ${LIB_DIR}" >&2
            ls -la "${LIB_DIR}" >&2 || true
            exit 1
          fi
          cp "${SRC}" "${LLVM_LIB_UNIX}/libxml2s.lib"
          echo "Installed ${LLVM_LIB_UNIX}/libxml2s.lib from ${SRC}"

          # Static libxml2 pulls zlib/iconv/lzma; llvm-sys only forwards
          # llvm-config --system-libs (which names libxml2s.lib, not deps).
          # Use mixed paths (C:/...) so GITHUB_ENV / RUSTFLAGS keep backslashes
          # from being treated as escapes.
          LIB_NATIVE="$(cygpath -m "${LIB_DIR}")"
          LIB_NATIVE_WIN="$(cygpath -w "${LIB_DIR}")"
          if [ -n "${LIB:-}" ]; then
            echo "LIB=${LIB_NATIVE_WIN};${LIB}" >> "${GITHUB_ENV}"
          else
            echo "LIB=${LIB_NATIVE_WIN}" >> "${GITHUB_ENV}"
          fi

          # Official x64 Windows LLVM embeds rpmalloc (overrides malloc). Rust's
          # default /MD pulls ucrt.dll imports → LNK2005. Use static CRT and
          # /INCLUDE:malloc so LLVMSupport's rpmalloc wins link order (llvm D71786).
          extra_rustflags="-Ctarget-feature=+crt-static -Clink-arg=/INCLUDE:malloc -Lnative=${LIB_NATIVE}"
          for dep in zlib libiconv lzma liblzma charset iconv; do
            if [ -f "${LIB_DIR}/${dep}.lib" ]; then
              extra_rustflags="${extra_rustflags} -Clink-arg=${dep}.lib"
            fi
          done
          # libxml2 >= 2.12 needs BCryptGenRandom; ws2_32 is usually already
          # in llvm-config --system-libs, but bcrypt is not.
          extra_rustflags="${extra_rustflags} -Clink-arg=bcrypt.lib"
          if [ -n "${RUSTFLAGS:-}" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS} ${extra_rustflags}" >> "${GITHUB_ENV}"
          else
            echo "RUSTFLAGS=${extra_rustflags}" >> "${GITHUB_ENV}"
          fi
          ls -la "${LLVM_LIB_UNIX}/libxml2s.lib"
          echo "LIB search: ${LIB_NATIVE_WIN}"
          echo "extra RUSTFLAGS: ${extra_rustflags}"
      - name: Build release CLI (full-native)
        run: |
          set -euo pipefail
          echo "SYX_LLVM_PREFIX=${SYX_LLVM_PREFIX:-}"
          echo "LLVM_SYS_211_PREFIX=${LLVM_SYS_211_PREFIX:-}"
          echo "RUSTFLAGS=${RUSTFLAGS:-}"
          CFG="${LLVM_SYS_211_PREFIX}/bin/llvm-config"
          if [ ! -f "${CFG}" ] && [ ! -f "${CFG}.exe" ]; then
            # Git Bash may need Unix path to test existence when env is Windows-native.
            if command -v cygpath >/dev/null 2>&1; then
              CFG_UNIX="$(cygpath -u "${LLVM_SYS_211_PREFIX}")/bin/llvm-config"
              CFG="${CFG_UNIX}"
            fi
          fi
          if [ -f "${CFG}" ]; then
            "${CFG}" --version
          elif [ -f "${CFG}.exe" ]; then
            "${CFG}.exe" --version
          else
            echo "ERROR: llvm-config not reachable via LLVM_SYS_211_PREFIX=${LLVM_SYS_211_PREFIX:-}" >&2
            exit 1
          fi
          # Defense in depth if the Windows libxml2 step did not run (shouldn't).
          if [ "${{ runner.os }}" = "Windows" ]; then
            case " ${RUSTFLAGS:-} " in
              *"crt-static"*) ;;
              *)
                export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-Ctarget-feature=+crt-static -Clink-arg=/INCLUDE:malloc"
                ;;
            esac
            echo "RUSTFLAGS(effective)=${RUSTFLAGS}"
          fi
          cargo build --release -p syx-cli --features full-native --target ${{ matrix.target }}
      # - name: Driver parity smoke (SYX 38.0)
      #   run: |
      #     cargo test -p syx-driver \
      #       --test evergreen --test lang --test concurrency --test stdlib \
      #       --test observability --test security --test backends \
      #       -- --test-threads=1
      # - name: examples/deps cross-module (local_math.add → 42)
      #   run: |
      #     BIN="target/${{ matrix.target }}/release/syx${{ matrix.exe_ext }}"
      #     "$BIN" run examples/deps | grep -q 42
      # - name: Build examples/hello native (minimal)
      #   if: matrix.native_examples
      #   run: |
      #     BIN="target/${{ matrix.target }}/release/syx${{ matrix.exe_ext }}"
      #     mkdir -p dist
      #     "$BIN" build --native --minimal -o "dist/examples-main-${{ matrix.artifact }}" examples
      - name: Package CLI
        run: |
          BIN="target/${{ matrix.target }}/release/syx${{ matrix.exe_ext }}"
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}${{ matrix.exe_ext }}"
          if [ -f "dist/examples-main-${{ matrix.artifact }}" ] || [ -f "dist/examples-main-${{ matrix.artifact }}.exe" ]; then
            chmod +x "dist/${{ matrix.artifact }}${{ matrix.exe_ext }}" "dist/examples-main-${{ matrix.artifact }}"* || true
          else
            chmod +x "dist/${{ matrix.artifact }}${{ matrix.exe_ext }}" || true
          fi
      - name: Generate checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS
      # - name: Release install smoke
      #   run: |
      #     CLI="dist/${{ matrix.artifact }}${{ matrix.exe_ext }}"
      #     "$CLI" --version || "$CLI" build --help
      #     if [ "${{ matrix.native_examples }}" = "true" ]; then
      #       test -x "dist/examples-main-${{ matrix.artifact }}" || test -f "dist/examples-main-${{ matrix.artifact }}"
      #     fi
