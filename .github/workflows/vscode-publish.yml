name: VS Code Publish

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  vsce-package-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode-syx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Install extension dependencies
        run: npm ci
      - name: Package VS Code extension (smoke)
        # Include runtime deps (vscode-languageclient); --no-dependencies ≈ empty shell.
        run: npx vsce package
      - name: Verify VSIX artifact
        run: |
          ls -la *.vsix
          size=$(wc -c < *.vsix | tr -d ' ')
          # Expect bundled deps (~hundreds of KB), not a ~20KB shell.
          if [ "$size" -lt 100000 ]; then
            echo "VSIX too small (${size} bytes); packaging likely omitted dependencies" >&2
            exit 1
          fi
