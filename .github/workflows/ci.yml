name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "21.1.6"

jobs:
  # ---------------------------------------------------------------------------
  # Required: must stay green on every PR / push (split for wall-clock + fail-fast)
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Deny compiler warnings (workspace libraries)
        # syx-gui is workspace-excluded; keep exclude name if a legacy package appears.
        run: RUSTFLAGS="-Dwarnings" cargo check --workspace --lib --exclude syx-synui

      - name: Clippy (correctness)
        run: >
          cargo clippy --workspace --lib --exclude syx-synui --
          -D clippy::correctness -A clippy::result_large_err

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Build CLI (debug)
        run: cargo build -p syx-cli

      # Prelude embeds are gitignored (rustc-tag churn). Gen builds release syx,
      # writes assets, rebuilds with include_bytes, and verifies embed hit.
      - name: Regen prelude embed + release CLI for this runner rustc
        run: bash scripts/gen_prelude_snapshot.sh

      - name: Prelude embed must match this toolchain
        run: bash scripts/check_prelude_embed.sh target/release/syx

      - name: Backend smoke (hello)
        run: SYX=./target/debug/syx bash scripts/s0_backend_smoke.sh

      - name: Examples VM allowlist
        run: bash scripts/examples_vm_contract.sh

      - name: Capability manifest up to date
        run: python3 scripts/gen_capabilities.py --check

      - name: IR capability tables up to date
        run: python3 scripts/gen_ir_capabilities.py --check

      - name: No internal tip fingerprints in public tests
        run: |
          if rg -n 'A-W[0-9]|one-thousand-and-' crates/syx-driver/tests; then
            echo "tip fingerprint nails must not appear in public tests" >&2
            exit 1
          fi
          if rg -n '^mod qs1_' crates/syx-driver/tests/native/main.rs; then
            echo "qs1_* mods must not remain in public native main" >&2
            exit 1
          fi

      - name: Crates must not embed plan/ sources
        run: |
          if rg -n 'include_str!\(".*plan/' crates; then
            echo "public crates must not include_str plan/ paths" >&2
            exit 1
          fi

      - name: Behavioral test count floor
        # LSP floor tracks post credibility-diet real nails (~1788); anti-delete only.
        run: bash scripts/audit_behavioral_tests.sh --min-driver 2600 --min-lsp 1700
  lsp:
    name: Language server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Language server tests
        # syx-lsp has ~1.8k unit nails; keep serial for stability, fail closed.
        run: cargo test -p syx-lsp --lib -- --test-threads=1

  # Split from former monolithic Core tests: `--workspace --lib --bins` compiled
  # llvm/wasm/async/hosts and burned the full 60m before driver suites started.
  test-libs:
    name: Core libs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Curated frontend / IR / runtime lib tests
        # Explicit -p list — do not `--workspace` (pulls syx-llvm, wasmtime, hosts).
        run: >
          cargo test --lib
          -p syx-diagnostics -p syx-lexer -p syx-ast -p syx-parser
          -p syx-semantic -p syx-codegen -p syx-vm -p syx-stdlib
          -p syx-mir -p syx-mir-run -p syx-frontend -p syx-fmt
          -p syx-lint -p syx-cst -p syx-config -p syx-runtime-core
          -p syx-macro -p syx-meta -p syx-mono -p syx-doc
          -- --test-threads=4

  # Split Core driver into parallel jobs so a single suite failure is visible
  # in the Actions UI without downloading gated logs.
  test-driver-lang:
    name: Core lang
    # Hard again: per-module 3m walls under script pty (e5b1b93 green on Linux).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Driver lang suite
        # Pipe+tee fully-buffers libtest on Linux, so a timeout kill left empty
        # trails. Run per-module under `script` (pty → line-buffered) with a 3m
        # wall so a hung nail names its module in public annotations.
        run: |
          set -euo pipefail
          : > /tmp/syx-lang.out
          : > /tmp/syx-lang-hangs.txt
          cargo test -p syx-driver --test lang --no-run
          fail=0
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "=== module $m ===" | tee -a /tmp/syx-lang.out
            set +e
            timeout 3m script -q -f -c \
              "cargo test -p syx-driver --test lang -- ${m}:: --test-threads=1 --color=never" \
              /tmp/syx-lang-mod.out
            ec=$?
            set -e
            if [ "$ec" -eq 0 ]; then
              grep -E 'test result:|FAILED' /tmp/syx-lang-mod.out | tee -a /tmp/syx-lang.out || true
            else
              echo "MODULE_FAIL $m exit=$ec" | tee -a /tmp/syx-lang.out
              echo "$m exit=$ec" >> /tmp/syx-lang-hangs.txt
              echo "::error title=lang-module::$m exit=$ec"
              grep -E '^test |FAILED|panicked' /tmp/syx-lang-mod.out | tail -15 \
                | tee -a /tmp/syx-lang.out || true
              tail -20 /tmp/syx-lang-mod.out >> /tmp/syx-lang.out || true
              fail=1
            fi
          done < <(sed -n 's/^mod \([a-z0-9_]*\);/\1/p' crates/syx-driver/tests/lang/main.rs)
          exit "$fail"
      - name: Summarize lang failures
        if: failure()
        run: |
          {
            echo "## Core lang failures / module walls"
            echo '```'
            cat /tmp/syx-lang-hangs.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### log tail"
            echo '```'
            tail -80 /tmp/syx-lang.out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/syx-lang-hangs.txt ]; then
            hangs=$(tr '\n' ' ' < /tmp/syx-lang-hangs.txt | head -c 1500)
            echo "::error title=lang-hang-modules::${hangs}"
          fi
          tail -15 /tmp/syx-lang.out | tr '\n' ' ' | head -c 1500 | while IFS= read -r line; do
            echo "::error title=lang-tail::${line}"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-lang-log
          path: |
            /tmp/syx-lang.out
            /tmp/syx-lang-hangs.txt
          retention-days: 7
          if-no-files-found: warn

  test-driver-concurrency:
    name: Core concurrency
    # Keep wall timeout; previously soft while Linux hung ~30m (now ~3–4m green).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Driver concurrency suite
        run: |
          set -o pipefail
          timeout 20m cargo test -p syx-driver --test concurrency -- --test-threads=1 2>&1 \
            | tee /tmp/syx-concurrency.out
      - name: Summarize concurrency failures
        if: failure()
        run: |
          {
            echo "## Core concurrency failures / last progress"
            echo '```'
            grep -nE 'FAILED|failures:|panicked|has been running for over|test result:' \
              /tmp/syx-concurrency.out | tail -80 || tail -80 /tmp/syx-concurrency.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|panicked at|has been running for over|test result:' \
            /tmp/syx-concurrency.out | tail -40 | while IFS= read -r line; do
            echo "::error title=concurrency::$line"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-concurrency-log
          path: /tmp/syx-concurrency.out
          retention-days: 7

  test-driver-data:
    name: Core data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Driver data suite
        run: cargo test -p syx-driver --test data -- --test-threads=1

  test-driver-credibility:
    name: Core credibility
    # Hard again after plan/01+02 SSOT + portable time -p + r26 release syx (f2317a0 green).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Census scripts need `rg` + `/usr/bin/time` (ubuntu images often omit `time`).
      - name: Install ripgrep + time
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep time
      # Prelude embeds are gitignored; credibility nails assert non-trivial asset bytes.
      - name: Regen prelude embed for this runner rustc
        run: bash scripts/gen_prelude_snapshot.sh
      - name: Verify prelude embeds are non-trivial
        run: |
          for f in \
            crates/syx-driver/assets/prelude_snapshot.bin \
            crates/syx-driver/assets/prelude_vm_image.rkyv \
            crates/syx-driver/assets/prelude_stdlib_mir.bin
          do
            sz=$(wc -c <"$f" | tr -d ' ')
            echo "$f bytes=$sz"
            if [ "$sz" -le 1024 ]; then
              echo "::error::$f still trivial after regen ($sz bytes)"
              exit 1
            fi
          done
      - name: Driver credibility suite
        run: |
          set -o pipefail
          cargo test -p syx-driver --test credibility -- --test-threads=1 2>&1 \
            | tee /tmp/syx-credibility.out
      - name: Summarize credibility failures
        if: failure()
        run: |
          {
            echo "## Core credibility failures"
            echo '```'
            rg -n 'FAILED|failures:|panicked|census script failed|assertion' \
              /tmp/syx-credibility.out | tail -120 || true
            echo '```'
            echo
            echo "### failure list"
            echo '```'
            rg -n '^failures:$' -A40 /tmp/syx-credibility.out | tail -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub caps ~10 annotations/step — pack names + first panics into few lines.
          rg -o 'test ([a-z0-9_:]+) \.\.\. FAILED' -r '$1' /tmp/syx-credibility.out \
            | sort -u > /tmp/syx-credibility-fails.txt || true
          if [ -s /tmp/syx-credibility-fails.txt ]; then
            echo "### failed tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/syx-credibility-fails.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            fails=$(tr '\n' ' ' < /tmp/syx-credibility-fails.txt | head -c 2000)
            echo "::error title=credibility-failed-tests::${fails}"
          fi
          rg -n 'panicked at|census script failed|assertion failed|No such file' \
            /tmp/syx-credibility.out | head -8 | while IFS= read -r line; do
            echo "::error title=credibility-panic::${line:0:200}"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-credibility-log
          path: |
            /tmp/syx-credibility.out
            /tmp/syx-credibility-fails.txt
          retention-days: 7
          if-no-files-found: warn

  # Aggregator keeps the historical required check name "Core driver".
  test-driver:
    name: Core driver
    runs-on: ubuntu-latest
    needs:
      - test-driver-data
      - test-driver-lang
      - test-driver-credibility
      - test-driver-concurrency
    steps:
      - name: Required Core driver suites passed
        run: echo "data+lang+credibility+concurrency green"

  # ---------------------------------------------------------------------------
  # Required: WASM / browser compiler artifacts
  # ---------------------------------------------------------------------------
  compiler-wasm:
    name: Compiler wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler.wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p syx-compiler-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/syx_compiler_wasm.wasm \
            examples/wasm_web/compiler.wasm
      - name: Upload compiler.wasm
        uses: actions/upload-artifact@v4
        with:
          name: compiler-wasm32
          path: examples/wasm_web/compiler.wasm

  wasm-aot-strict:
    name: WASM AOT (strict fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Strict fixture matrix (≥99% direct)
        run: bash scripts/wasm_aot_ratio.sh --matrix --min-direct 0.99

  wasm-aot-full:
    name: WASM AOT (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full-tier main.sy (100% direct)
        run: bash scripts/wasm_aot_ratio.sh --matrix --full --min-direct 1.0

  # ---------------------------------------------------------------------------
  # Soft: informative until the gate is paid / stable on this runner
  # (continue-on-error so trunk stays mergeable; failures still show in the UI)
  # ---------------------------------------------------------------------------
  windows-smoke:
    name: Windows smoke
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prelude embeds are gitignored; gen builds release + verifies embed hit.
      - name: Regen prelude embed + release CLI for this runner rustc
        shell: pwsh
        run: .\scripts\gen_prelude_snapshot.ps1
      - name: Prelude embed must match this toolchain
        shell: pwsh
        run: .\scripts\check_prelude_embed.ps1 target\release\syx.exe
      # cargo's filter is a substring (`smoke::` matches `plugin_smoke::`).
      # Enumerate exact `smoke::*` names (portable; no mapfile — Git Bash / bash 3.x).
      # Quote matters: bare `run: ... smoke:: ...` is invalid YAML (ffcda61).
      - name: Driver evergreen smoke
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(cargo test -p syx-driver --test evergreen -- --list \
            | awk -F': ' '/^smoke::/{print $1}')
          echo "running ${#tests[@]} smoke:: tests"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error title=windows-smoke::no smoke:: tests enumerated"
            exit 1
          fi
          cargo test -p syx-driver --test evergreen -- --test-threads=1 "${tests[@]}"
      - name: Host plugin load (.dll)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo build -p syx-host-plugin --release
          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(cargo test -p syx-driver --test evergreen -- --list \
            | awk -F': ' '/^plugin_smoke::/{print $1}')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::warning title=windows-plugin-smoke::no plugin_smoke:: tests"
            exit 0
          fi
          cargo test -p syx-driver --test evergreen -- --test-threads=1 "${tests[@]}"
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=windows-plugin-smoke::exit=$ec (soft)"
          fi
          exit 0

  book-doctest:
    name: Book doctests (English)
    continue-on-error: true
    runs-on: ubuntu-latest
    # Soft advisory — full guide is too slow/flaky for the merge matrix.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p syx-cli
      - name: Language-guide pass rate (advisory)
        run: |
          set +e
          OUT="${RUNNER_TEMP}/book_pass.json"
          timeout 15m python3 scripts/book_pass_rate.py --syx ./target/debug/syx --json "$OUT"
          ec=$?
          set -e
          if [ ! -f "$OUT" ]; then
            echo "::warning title=book::no book_pass.json (timeout/exit=$ec); soft-skip"
            exit 0
          fi
          python3 - "$OUT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          passed, total = d.get("passed"), d.get("total")
          rate, parse_fail = d.get("rate_pct"), d.get("parse_fail_approx")
          print(f"book_pass: {passed}/{total} rate_pct={rate} parse_fail_approx={parse_fail}")
          ok = (
              passed == total
              and total is not None
              and total > 0
              and rate == 100.0
              and parse_fail == 0
          )
          if not ok:
              print(f"::warning title=book-gate::rate={rate} passed={passed}/{total} (soft)")
          else:
              print("book doctest gate PASS")
          PY
      - name: Upload book_pass JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-pass-en
          path: ${{ runner.temp }}/book_pass.json
          if-no-files-found: warn

  browser-e2e:
    name: Browser E2E (Playwright)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler.wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p syx-compiler-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/syx_compiler_wasm.wasm \
            examples/wasm_web/compiler.wasm
      - name: Playwright (Chromium only; soft)
        run: |
          set +e
          if [ -f examples/wasm_web/playwright.config.js ]; then
            cd examples/wasm_web
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npx playwright install --with-deps chromium
            timeout 20m npx playwright test --project=chromium
            ec=$?
            if [ "$ec" -ne 0 ]; then
              echo "::warning title=browser-e2e::chromium exit=$ec (soft)"
            fi
            exit 0
          fi
          timeout 15m cargo test -p syx-driver --test browser -- --test-threads=1
          exit 0

  # C-2b-2 floor + C-2b-3 path_file paid raise (Linux).
  # No continue-on-error — merge-hard. Soft native-linux job below stays advisory.
  full-native-linux:
    name: Full-native (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install host libs for llvm-sys
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev zlib1g-dev libxml2-dev libzstd-dev
      - name: Install LLVM ${{ env.LLVM_VERSION }} (full-native)
        env:
          LLVM_ASSET: LLVM-21.1.6-Linux-X64.tar.xz
        run: bash scripts/ci_install_llvm.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: full-native-linux-llvm${{ env.LLVM_VERSION }}
      - name: Build syx-cli with full-native
        run: cargo build -p syx-cli --features full-native
      - name: Native hello smoke
        run: |
          set -euo pipefail
          ./target/debug/syx build --native examples/hello.sy
      - name: Path/file native GA (C-2b-3)
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          set -euo pipefail
          cargo test -p syx-driver --features full-native --test backends path_file_native_wasm_ga -- --test-threads=1
      - name: TCP native GA (C-2b-4)
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          set -euo pipefail
          cargo test -p syx-driver --features full-native --test backends tcp_native_wasm_ga -- --test-threads=1
      - name: SQL native GA (C-2b-5)
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          set -euo pipefail
          cargo test -p syx-driver --features full-native --test backends sql_native_wasm_ga -- --test-threads=1

  native-linux:
    name: Native link (Linux)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native strict parity + hello
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          set -euo pipefail
          set +e
          script -q -f -c \
            "cargo test -p syx-driver --test native -- native_strict_parity --test-threads=1 --color=never" \
            /tmp/native-parity.out
          ec1=$?
          script -q -f -c \
            "cargo test -p syx-driver --test evergreen -- parity_native --test-threads=1 --color=never" \
            /tmp/evergreen-parity.out
          ec2=$?
          set -e
          if [ "$ec1" -ne 0 ]; then
            echo "::error title=native-strict::exit=$ec1"
            tail -40 /tmp/native-parity.out || true
          fi
          if [ "$ec2" -ne 0 ]; then
            echo "::error title=evergreen-parity-native::exit=$ec2"
            tail -40 /tmp/evergreen-parity.out || true
          fi
          cargo build -p syx-cli
          # C-2b+: default CLI lacks `--features full-native` (L006).
          # L006 must NOT soft-skip to step success; job stays continue-on-error.
          soft_native() {
            local src="$1"
            local err
            err="$(mktemp)"
            # miette diagnostics go to stdout; capture both streams for L006 detect.
            if ./target/debug/syx build --native "$src" >"$err" 2>&1; then
              rm -f "$err"
              return 0
            fi
            if grep -Eq 'L006|full-native' "$err"; then
              echo "::warning title=native-linux::L006 without full-native ($src) — unpaid (C-2b+)"
              cat "$err"
              rm -f "$err"
              return 1
            fi
            cat "$err" >&2
            rm -f "$err"
            return 1
          }
          soft_ec=0
          soft_native examples/hello.sy || soft_ec=1
          soft_native examples/main_sync.sy || soft_ec=1
          if [ "$ec1" -ne 0 ] || [ "$ec2" -ne 0 ]; then
            echo "::warning title=native-parity::strict=$ec1 evergreen=$ec2"
          fi
          if [ "$ec1" -ne 0 ] || [ "$ec2" -ne 0 ] || [ "$soft_ec" -ne 0 ]; then
            exit 1
          fi
          exit 0
      - name: Native host-shake hello size
        run: |
          set +e
          # Soft advisory job may fall back; paid floor is full-native-linux (C-2b++).
          cargo build -p syx-cli --features full-native --release || cargo build -p syx-cli --release
          bash scripts/native_host_shake_size.sh
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=native-host-shake::exit=$ec (soft)"
          fi
          exit 0
      - name: Differential suite (advisory)
        timeout-minutes: 20
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          set +e
          timeout 18m cargo test -p syx-driver --test differential -- --test-threads=1
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=native-differential::exit=$ec (soft)"
          fi
          exit 0
      - name: Upload differential failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failures
          path: target/differential-failures/
          if-no-files-found: ignore
      # Domain/property/fuzz duplicate Core/Extended and hang/flake on Linux soft matrix.
      - name: Domain / property / fuzz (skipped on soft native)
        run: |
          echo "::notice title=native-linux::domain/property/fuzz deferred to Core/Extended/nightly"
          exit 0

  native-macos:
    name: Native link (macOS)
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build runtime + CLI
        run: cargo build --release -p syx-rt -p syx-cli
      - name: Native link hello project
        run: |
          set +e
          cargo build -p syx-cli
          dir=$(mktemp -d)
          printf 'func main() { print("hi") }\n' > "$dir/main.sy"
          printf 'name = "hello"\nmain = "main.sy"\n' > "$dir/syx.toml"
          err="$(mktemp)"
          # C-2b+: L006 must NOT soft-skip to step success; job stays continue-on-error.
          # miette diagnostics go to stdout; capture both streams for L006 detect.
          if ./target/debug/syx build --native -o "$dir/app" "$dir" >"$err" 2>&1; then
            rm -f "$err"
            exit 0
          fi
          if grep -Eq 'L006|full-native' "$err"; then
            echo "::warning title=native-macos::L006 without full-native — unpaid (C-2b+)"
            cat "$err"
            rm -f "$err"
            exit 1
          fi
          echo "::warning title=native-macos::non-L006 build failure (soft)"
          cat "$err" || true
          rm -f "$err"
          exit 1

  gui-xvfb:
    name: GUI tests (xvfb)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfreetype6-dev libfontconfig1-dev pkg-config
      - name: Build GUI library
        run: cargo build --manifest-path crates/syx-gui/Cargo.toml
      - name: Driver GUI suite under xvfb
        run: |
          set +e
          export SYX_GUI_DYLIB=target/debug/libsyx_gui.so
          timeout 15m xvfb-run -a cargo test -p syx-driver --test gui -- --test-threads=1
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=gui::exit=$ec (soft)"
          fi
          exit 0

  extended-suites:
    name: Extended driver suites
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Category integration suites
        # Hang-prone targets (evergreen/wasm/native/runtime) use per-module 2m
        # walls under script pty — same pattern that cleared Core lang.
        # Lighter targets keep a single 8m wall. Soft job: report, don't block.
        run: |
          set -euo pipefail
          : > /tmp/syx-extended.out
          : > /tmp/syx-extended-hangs.txt
          cargo test -p syx-driver --no-run \
            --test evergreen --test platform --test wasm --test farm \
            --test browser --test native --test runtime \
            --test backends --test security

          run_modules() {
            local t="$1" main="$2" wall="$3"
            local fail_mod=0
            while IFS= read -r m; do
              [ -z "$m" ] && continue
              echo "=== $t::$m ===" | tee -a /tmp/syx-extended.out
              set +e
              timeout "${wall}" script -q -f -c \
                "cargo test -p syx-driver --test $t -- ${m}:: --test-threads=1 --color=never" \
                /tmp/syx-ext-one.out
              ec=$?
              set -e
              if [ "$ec" -ne 0 ]; then
                echo "MODULE_FAIL $t::$m exit=$ec" | tee -a /tmp/syx-extended.out
                echo "$t::$m exit=$ec" >> /tmp/syx-extended-hangs.txt
                echo "::warning title=extended-module::$t::$m exit=$ec"
                grep -E '^test |FAILED|panicked' /tmp/syx-ext-one.out | tail -10 \
                  | tee -a /tmp/syx-extended.out || true
                fail_mod=1
              else
                grep -E 'test result:' /tmp/syx-ext-one.out | tee -a /tmp/syx-extended.out || true
              fi
            done < <(sed -n 's/^mod \([a-z0-9_]*\);/\1/p' "$main")
            return "$fail_mod"
          }

          fail=0
          # Module-sharded hang-prone suites.
          for pair in \
            "evergreen:crates/syx-driver/tests/evergreen/main.rs" \
            "wasm:crates/syx-driver/tests/wasm/main.rs" \
            "native:crates/syx-driver/tests/native/main.rs" \
            "runtime:crates/syx-driver/tests/runtime/main.rs"
          do
            t="${pair%%:*}"
            main="${pair#*:}"
            run_modules "$t" "$main" 2m || fail=1
          done
          # Whole-target lighter suites.
          for t in platform farm browser backends security; do
            echo "=== --test $t ===" | tee -a /tmp/syx-extended.out
            set +e
            timeout 8m script -q -f -c \
              "cargo test -p syx-driver --test $t -- --test-threads=1 --color=never" \
              /tmp/syx-ext-one.out
            ec=$?
            set -e
            if [ "$ec" -ne 0 ]; then
              echo "TARGET_FAIL $t exit=$ec" | tee -a /tmp/syx-extended.out
              echo "$t exit=$ec" >> /tmp/syx-extended-hangs.txt
              echo "::warning title=extended-target::$t exit=$ec"
              fail=1
            else
              grep -E 'test result:' /tmp/syx-ext-one.out | tee -a /tmp/syx-extended.out || true
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::warning title=extended::some modules soft-failed (see hangs file)"
          fi
          exit 0
      - name: Summarize extended soft failures
        if: always()
        run: |
          if [ -s /tmp/syx-extended-hangs.txt ]; then
            {
              echo "## Extended soft module/target failures"
              echo '```'
              cat /tmp/syx-extended-hangs.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            hangs=$(tr '\n' ' ' < /tmp/syx-extended-hangs.txt | head -c 1500)
            echo "::warning title=extended-hang-targets::${hangs}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-driver-log
          path: |
            /tmp/syx-extended.out
            /tmp/syx-extended-hangs.txt
          retention-days: 7
          if-no-files-found: ignore

  jit:
    name: JIT tier-2
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier-2 default-off / opt-in
        run: |
          # cargo accepts a single TESTNAME filter; run the two opt-in cases separately.
          cargo test -p syx-vm --features jit-tier2 -- --nocapture tier2_prod_default_when_unset
          cargo test -p syx-vm --features jit-tier2 -- --nocapture tier2_explicit_one_enables
          SYX_JIT_TIER2=0 cargo test -p syx-vm --features jit-tier2 -- --nocapture \
            tier2_explicit_zero_disables_prod_default
      - name: JIT differential (advisory)
        run: |
          set +e
          timeout 15m script -q -f -c \
            "env SYX_JIT_TIER2=1 cargo test -p syx-driver --test lang -- jit_suite1_differential --test-threads=1 --nocapture --include-ignored --color=never" \
            /tmp/jit-diff.out
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=jit-differential::exit=$ec (soft)"
            grep -E 'FAILED|panicked|test result:' /tmp/jit-diff.out | tail -30 || true
            tail -40 /tmp/jit-diff.out || true
          fi
          exit 0
      - name: JIT opt-out smoke
        # Avoid evergreen integration:: (Linux hang). Exact smoke nail; quote for YAML.
        run: |
          set +e
          timeout 3m env SYX_JIT_TIER2=0 cargo test -p syx-driver --test evergreen \
            -- --exact smoke::manifest_current --test-threads=1 --color=never
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::warning title=jit-optout::exit=$ec (soft)"
          fi
          exit 0
