name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Required: must stay green on every PR / push
  # ---------------------------------------------------------------------------
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Deny compiler warnings (workspace libraries)
        # syx-gui is workspace-excluded; keep exclude name if a legacy package appears.
        run: RUSTFLAGS="-Dwarnings" cargo check --workspace --lib --exclude syx-synui

      - name: Clippy (correctness)
        run: >
          cargo clippy --workspace --lib --exclude syx-synui --
          -D clippy::correctness -A clippy::result_large_err

      - name: Build CLI (debug + release)
        run: |
          cargo build -p syx-cli
          cargo build -p syx-cli --release

      - name: Prelude embed must match this toolchain
        run: bash scripts/check_prelude_embed.sh target/release/syx

      - name: Backend smoke (hello)
        run: SYX=./target/debug/syx bash scripts/s0_backend_smoke.sh

      - name: Examples VM allowlist
        run: bash scripts/examples_vm_contract.sh

      - name: Capability manifest up to date
        run: python3 scripts/gen_capabilities.py --check

      - name: IR capability tables up to date
        run: python3 scripts/gen_ir_capabilities.py --check

      - name: No internal tip fingerprints in public tests
        run: |
          if rg -n 'A-W[0-9]|one-thousand-and-' crates/syx-driver/tests; then
            echo "tip fingerprint nails must not appear in public tests" >&2
            exit 1
          fi
          if rg -n '^mod qs1_' crates/syx-driver/tests/native/main.rs; then
            echo "qs1_* mods must not remain in public native main" >&2
            exit 1
          fi

      - name: Crates must not embed plan/ sources
        run: |
          if rg -n 'include_str!\(".*plan/' crates; then
            echo "public crates must not include_str plan/ paths" >&2
            exit 1
          fi

      - name: Behavioral test count floor
        # LSP floor tracks post credibility-diet real nails (~1788); anti-delete only.
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          bash scripts/audit_behavioral_tests.sh --min-driver 2600 --min-lsp 1700

      - name: Language server tests
        run: cargo test -p syx-lsp -- --test-threads=1

      - name: Workspace tests
        run: cargo test --workspace -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Required: WASM / browser compiler artifacts
  # ---------------------------------------------------------------------------
  compiler-wasm:
    name: Compiler wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler.wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p syx-compiler-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/syx_compiler_wasm.wasm \
            examples/wasm_web/compiler.wasm
      - name: Upload compiler.wasm
        uses: actions/upload-artifact@v4
        with:
          name: compiler-wasm32
          path: examples/wasm_web/compiler.wasm

  wasm-aot-strict:
    name: WASM AOT (strict fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Strict fixture matrix (≥99% direct)
        run: bash scripts/wasm_aot_ratio.sh --matrix --min-direct 0.99

  wasm-aot-full:
    name: WASM AOT (full tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full-tier main.sy (100% direct)
        run: bash scripts/wasm_aot_ratio.sh --matrix --full --min-direct 1.0

  # ---------------------------------------------------------------------------
  # Soft: informative until the gate is paid / stable on this runner
  # (continue-on-error so trunk stays mergeable; failures still show in the UI)
  # ---------------------------------------------------------------------------
  windows-smoke:
    name: Windows smoke
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p syx-cli --release
      - name: Prelude embed (may miss if rustc differs from checked-in assets)
        shell: pwsh
        run: .\scripts\check_prelude_embed.ps1 target\release\syx.exe
      - name: Driver evergreen smoke
        run: cargo test -p syx-driver --test evergreen -- smoke --test-threads=1
      - name: Host plugin load (.dll)
        run: |
          cargo build -p syx-host-plugin --release
          cargo test -p syx-driver --test evergreen -- plugin_smoke --test-threads=1

  book-doctest:
    name: Book doctests (English)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p syx-cli
      - name: Language-guide pass rate (expect 100%)
        run: |
          OUT="${RUNNER_TEMP}/book_pass.json"
          python3 scripts/book_pass_rate.py --syx ./target/debug/syx --json "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          passed, total = d.get("passed"), d.get("total")
          rate, parse_fail = d.get("rate_pct"), d.get("parse_fail_approx")
          print(f"book_pass: {passed}/{total} rate_pct={rate} parse_fail_approx={parse_fail}")
          ok = (
              passed == total
              and total is not None
              and total > 0
              and rate == 100.0
              and parse_fail == 0
          )
          if not ok:
              print("book doctest gate FAIL", file=sys.stderr)
              sys.exit(1)
          print("book doctest gate PASS")
          PY
      - name: Upload book_pass JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-pass-en
          path: ${{ runner.temp }}/book_pass.json
          if-no-files-found: warn

  browser-e2e:
    name: Browser E2E (Playwright)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler.wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p syx-compiler-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/syx_compiler_wasm.wasm \
            examples/wasm_web/compiler.wasm
      - name: Playwright (Chromium / Firefox / WebKit)
        run: |
          if [ -f examples/wasm_web/playwright.config.js ]; then
            npm ci --prefix examples/wasm_web 2>/dev/null \
              || npm install --prefix examples/wasm_web @playwright/test
            npx --prefix examples/wasm_web playwright install chromium firefox webkit
            npx --prefix examples/wasm_web playwright test \
              --project=chromium --project=firefox --project=webkit
            npm run --prefix examples/wasm_web test:gui
          else
            cargo test -p syx-driver --test browser -- --test-threads=1
          fi

  native-linux:
    name: Native link (Linux)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native strict parity + hello
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          cargo test -p syx-driver --test native -- native_strict_parity --test-threads=1
          cargo test -p syx-driver --test evergreen -- parity_native --test-threads=1
          cargo build -p syx-cli
          ./target/debug/syx build --native examples/hello.sy
          ./target/debug/syx build --native examples/main_sync.sy
      - name: Differential suite
        timeout-minutes: 20
        env:
          SYX_NATIVE_STRICT: "1"
        run: cargo test -p syx-driver --test differential -- --test-threads=1
      - name: Upload differential failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failures
          path: target/differential-failures/
          if-no-files-found: ignore
      - name: Domain suites
        run: >
          cargo test -p syx-driver
          --test evergreen --test lang --test concurrency --test stdlib
          --test observability --test security --test backends
          -- --test-threads=1
      - name: Property smoke
        run: cargo test -p syx-driver --test property_smoke -- --nocapture
      - name: Fuzz smoke (1 run)
        run: |
          cargo install cargo-fuzz --locked
          sudo apt-get update && sudo apt-get install -y clang
          cargo fuzz run syx_smoke -- -runs=1

  native-macos:
    name: Native link (macOS)
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build runtime + CLI
        run: cargo build --release -p syx-rt -p syx-cli
      - name: Native link hello project
        run: |
          cargo build -p syx-cli
          dir=$(mktemp -d)
          printf 'func main() { print("hi") }\n' > "$dir/main.sy"
          printf 'name = "hello"\nmain = "main.sy"\n' > "$dir/syx.toml"
          ./target/debug/syx build --native -o "$dir/app" "$dir"

  gui-xvfb:
    name: GUI tests (xvfb)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build GUI library
        run: cargo build --manifest-path crates/syx-gui/Cargo.toml
      - name: Driver GUI suite under xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export SYX_GUI_DYLIB=target/debug/libsyx_gui.so
          xvfb-run -a cargo test -p syx-driver --test gui -- --test-threads=1

  extended-suites:
    name: Extended driver / LSP suites
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Category integration suites
        run: >
          cargo test -p syx-driver
          --test platform --test wasm --test farm --test data
          --test gui --test browser --test native --test runtime
          -- --test-threads=1
      - name: Language server integration matrix
        run: cargo test -p syx-lsp -- --test-threads=1

  jit:
    name: JIT tier-2
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier-2 default-off / opt-in
        run: |
          # cargo accepts a single TESTNAME filter; run the two opt-in cases separately.
          cargo test -p syx-vm --features jit-tier2 -- --nocapture tier2_prod_default_when_unset
          cargo test -p syx-vm --features jit-tier2 -- --nocapture tier2_explicit_one_enables
          SYX_JIT_TIER2=0 cargo test -p syx-vm --features jit-tier2 -- --nocapture \
            tier2_explicit_zero_disables_prod_default
      - name: JIT differential
        run: >
          SYX_JIT_TIER2=1 cargo test -p syx-driver --test lang
          -- jit_suite1_differential --test-threads=1 --nocapture
      - name: JIT opt-out smoke
        run: >
          SYX_JIT_TIER2=0 cargo test -p syx-driver --test evergreen
          -- integration --test-threads=1

  parity:
    name: Broad parity (optional)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p syx-cli
      - name: Consolidated domain suites
        run: >
          cargo test -p syx-driver
          --test evergreen --test lang --test concurrency --test stdlib
          --test observability --test security --test backends
          -- --test-threads=1
      - name: Category + differential suites
        timeout-minutes: 45
        run: >
          cargo test -p syx-driver
          --test gui --test wasm --test browser --test native --test runtime
          --test data --test farm --test platform --test differential
          -- --test-threads=1
      - name: Upload differential failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failures-parity
          path: target/differential-failures/
          if-no-files-found: ignore
      - name: Native strict matrix
        env:
          SYX_NATIVE_STRICT: "1"
        run: |
          cargo test -p syx-driver --test evergreen -- parity_native --test-threads=1
          cargo test -p syx-driver --test native -- native_strict_parity --test-threads=1
      - name: Registry signature E2E
        env:
          SYX_REGISTRY_REQUIRE_SIGNATURE: "1"
        run: |
          cargo test -p syx-driver --test evergreen -- registry_cdn_hard --test-threads=1
          cargo test -p syx-driver --test evergreen -- registry_signed_hard --test-threads=1
      - name: Browser compiler E2E
        run: cargo test -p syx-driver --test browser -- browser_ --test-threads=1
      - name: build.syb runner
        run: cargo test -p syx-driver --test evergreen -- build_syx --test-threads=1
      - name: Fixture audit
        run: scripts/audit_test_fixtures.sh --check
