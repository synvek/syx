# Internal wiring for llvm-sys (inkwell llvm21-1). Users should set SYX_LLVM_PREFIX
# or place LLVM at <workspace>/../llvm — not LLVM_SYS_*_PREFIX.
#
# Cargo resolves `relative = true` against the project directory that owns `.cargo/`
# (workspace root), not against `.cargo/` itself — so sibling LLVM is `../llvm`.
[env]
LLVM_SYS_211_PREFIX = { value = "../llvm", relative = true }
