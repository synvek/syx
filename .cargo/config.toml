# Internal wiring for llvm-sys (inkwell llvm21-1). Users should set SYX_LLVM_PREFIX
# or place LLVM at <workspace>/../llvm — not LLVM_SYS_*_PREFIX.
#
# Cargo resolves `relative = true` against the project directory that owns `.cargo/`
# (workspace root), not against `.cargo/` itself — so sibling LLVM is `../llvm`.
#
# Do NOT put `+crt-static` here: it would bake a static CRT into `syx_rt.lib` and
# break `syx build --native` (missing memmove / __imp_*). Windows full-native CLI
# builds pass those flags via `--config` (see scripts/build-full-native and CI).
[env]
LLVM_SYS_211_PREFIX = { value = "../llvm", relative = true }
# C-5h: permission.sandbox defaults on. Cargo-local unit/integration tests that
# exercise HostFn slices inherit domain grants so KPI nails do not mass-S024.
# Product `./target/debug/syx` outside cargo still denies un-granted domains.
SYX_ALLOW_NET = "1"
SYX_ALLOW_FS = "1"
SYX_ALLOW_ENV = "1"
SYX_ALLOW_PROCESS = "1"
SYX_ALLOW_PLUGIN = "1"
