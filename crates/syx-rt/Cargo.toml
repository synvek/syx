[package]
name = "syx-rt"
description = "Native runtime library for SYX Cranelift backend (C ABI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
syx-diagnostics = { workspace = true }
syx-mir = { workspace = true }
syx-mir-run = { workspace = true }
syx-runtime-core = { workspace = true }
syx-stdlib = { workspace = true }
syx-host-plugin = { workspace = true }
# workspace.dependencies.syx-vm already enables default-features; do not set
# default-features=false here (Cargo ignores it and warns).
syx-vm = { workspace = true, features = ["interpreter", "jit-tier2"] }
syx-async = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tempfile = "3"

[features]
default = ["async-runtime"]
async-runtime = ["dep:syx-async", "dep:crossbeam-channel", "dep:parking_lot"]
http = ["syx-vm/http", "syx-mir-run/http"]
file = ["syx-vm/file", "syx-mir-run/file"]
full = ["async-runtime", "http", "file"]
# Vendored LLD lives on syx-driver/syx-cli (full-native), not here — otherwise
# libsyx_rt.a absorbs LLVM/LLD and every `syx build --native` becomes a multi-GB link.

[dev-dependencies]
syx-parser = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Locate MSVC `link.exe` + LIB/INCLUDE so native AOT can resolve CRT / kernel32.
cc = "1"

[build-dependencies]
cc = "1"
