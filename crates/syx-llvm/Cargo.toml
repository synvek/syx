[package]
name = "syx-llvm"
description = "LLVM backend for SYX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Host LLVM via inkwell 0.9. Requires sibling ../llvm or SYX_LLVM_PREFIX.
llvm = ["dep:inkwell"]

[dependencies]
syx-mir = { workspace = true }
syx-diagnostics = { workspace = true }
inkwell = { version = "0.9.0", optional = true, default-features = true, features = ["llvm21-1"] }

[build-dependencies]
syx-llvm-prefix = { workspace = true }
