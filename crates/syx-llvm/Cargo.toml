[package]
name = "syx-llvm"
description = "LLVM backend for SYX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Host LLVM via inkwell 0.9. Requires sibling ../llvm or SYX_LLVM_PREFIX.
llvm = ["dep:inkwell"]

[dependencies]
syx-mir = { workspace = true }
syx-diagnostics = { workspace = true }
# Official Windows clang+llvm builds omit many backends (SystemZ, LoongArch, …).
# inkwell's default `target-all` still compiles initialize_* for those targets into
# the same CGU as initialize_all/native, so MSVC then fails with LNK2019. Only
# enable hosts we actually AOT for.
inkwell = { version = "0.9.0", optional = true, default-features = false, features = ["llvm21-1", "target-x86", "target-aarch64"] }

[build-dependencies]
syx-llvm-prefix = { workspace = true }
