[package]
name = "syx-host-plugin"
description = "Dynamic Host plugin loader (ADR-071 P0+P1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
syx-diagnostics = { workspace = true }
syx-stdlib = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
syx-runtime-core = { workspace = true }
ed25519-dalek = { workspace = true }
hex = "0.4"
faer = { version = "0.21", optional = true }

# Dynamic .so/.dll loading is native-only; wasm32 (syx-macro → host-plugin) stubs out.
[target.'cfg(any(unix, windows))'.dependencies]
libloading = "0.8"

[features]
# Off by default so wasm32 (syx-macro → host-plugin) does not pull faer.
# Native consumers that need P-SURF enable `p-faer` explicitly (e.g. syx-driver).
default = []
p-faer = ["dep:faer"]

[dev-dependencies]
tempfile = "3"
