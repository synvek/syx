[package]
name = "syx-vm"
description = "Stack-based virtual machine for SYX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
syx-runtime-core = { workspace = true }
syx-codegen = { workspace = true, optional = true }
syx-diagnostics = { workspace = true }
syx-ast = { workspace = true }
syx-stdlib = { workspace = true }
smol_str = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
libm = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
syx-meta = { workspace = true }
syx-cranelift-jit = { workspace = true, optional = true }
syx-mir = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = { workspace = true }
caseless = { workspace = true }
ed25519-dalek = { workspace = true }
flate2 = { workspace = true }
url = "2"
chrono = { workspace = true }
chrono-tz = { workspace = true }
notify = { version = "6", optional = true }
winit = { version = "0.29", optional = true }
softbuffer = { version = "0.4", optional = true }
syx-gui = { path = "../syx-gui", optional = true }
# S0-02: SynUI via git rev (optional). Default builds do not need a sibling ../synui
# checkout — Cargo only fetches this when `gui-synui` is enabled / lockfile resolved.
# synui v0.3 dropped the `legacy` feature; no feature flags on the dep.
synui = { git = "https://github.com/synvek/synui", rev = "87aa5580ddbfd4d6f1c938e2a8877390bcdd5c6d", optional = true }
prost = { version = "0.13" }
libloading = { version = "0.8", optional = true }

[features]
default = ["interpreter", "http", "file", "jit-tier2", "sql", "tls"]
sql = ["dep:syx-sql-impl"]
interpreter = ["dep:syx-codegen"]
jit-tier2 = ["dep:syx-cranelift-jit", "dep:syx-mir"]
http = ["dep:syx-http-impl"]
# Separate from http so a slim runtime can drop rustls / Tls.serve.
tls = ["dep:syx-tls-impl", "dep:rustls", "dep:rcgen"]
file = ["dep:notify"]
gui-winit = ["dep:winit", "dep:softbuffer"]
# Phase 124: syx-gui no longer default; optional opt-in only (retired product path).
gui-syx-isolated = ["dep:syx-gui"]
# Phase 124: dlopen libsyx_gui retired from default driver path.
gui-dlopen = ["dep:libloading"]
# Opt-in SynUI host bridge (sibling ../synui). Off by default — not for server builds.
gui-synui = ["dep:synui"]
codable-prost = []

# Native-only: C/asm build scripts fail on wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Optional: gRPC/WSS evidence still in this crate. Http.serve TLS lives in syx-http-impl.
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
zstd = "0.13"
# SQL/ORM rusqlite hosts live in syx-sql-impl (native only; C sqlite fails on wasm32).
syx-sql-impl = { workspace = true, optional = true }
syx-http-impl = { workspace = true, optional = true }
syx-tls-impl = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
