[meta]
version = "0.1"
schema = "syx-module-rename-v0"
adr = "docs/adr/stdlib-swift-alignment.md"
package_id_prefix = "syx-"
import_case = "UpperCamelCase"

# current_import = today's `import` name (or prelude façade)
# target_import = future `import` / surface
# package_id = future registry / syx.toml package name (kebab)
# disposition = merge | rename | split | core | retire | keep

